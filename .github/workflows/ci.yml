name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run version:check
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # better-sqlite3 is a native module and is (re)built from source here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - name: Coverage gate
        if: matrix.node-version == '24.x'
        run: pnpm exec vitest run --coverage
      - run: pnpm run build

  helper:
    name: Rust helper (fmt, clippy, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # v1; toolchain pinned in rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper -> target
      - run: cargo fmt --check
        working-directory: helper
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: helper
      - run: cargo test --locked
        working-directory: helper
      - run: cargo build --locked --release
        working-directory: helper
      # Dry run of the release's Claude Desktop extension with this helper, so
      # packing problems show up before a release.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack and smoke-test the extension with this helper
        run: |
          mkdir -p ci-helpers
          cp helper/target/release/eule-helper ci-helpers/eule-helper-linux-x64
          node scripts/pack-mcpb.mjs --helpers ci-helpers --out release-mcpb
          node scripts/verify-mcpb.mjs release-mcpb/eule-mcp.mcpb
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: helper/Cargo.toml

  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Validate changed commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format=%B "$BASE_SHA..$HEAD_SHA" | awk 'NF && $0 !~ /^#/ {print; exit}' >/dev/null
          while IFS= read -r subject; do
            case "$subject" in
              Merge\ *|Revert\ \"*|fixup!\ *|squash!\ *|amend!\ *) continue ;;
            esac
            printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || { echo "Invalid commit: $subject"; exit 1; }
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")

  ci-success:
    name: CI Success
    if: always()
    needs: [quality, test, helper, commit-hygiene, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.helper.result }}" != "success" || "${{ needs.secrets.result }}" != "success" || ("${{ github.event_name }}" == "pull_request" && "${{ needs.commit-hygiene.result }}" != "success") ]]; then
            echo "One or more required CI jobs failed." >&2
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
