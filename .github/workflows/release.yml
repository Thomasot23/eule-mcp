name: Release helper binaries

# Builds eule-helper for every platform × arch and attaches the binaries (plus
# .sha256 sidecars) to the GitHub release for the pushed tag. The Node package
# downloads the matching asset on first use (see src/helper/download.ts). The
# Claude Desktop extension (eule-mcp.mcpb) bundles all of them for one download.
on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true
        type: string
    # A called workflow sees only the secrets its caller passes, even in jobs
    # that use the release environment. Declared as required so a caller that
    # forgets them fails at once instead of in the preflight.
    secrets:
      MACOS_CERT_P12:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY_CONTENT:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          pnpm version:check
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    environment: release
    needs: metadata
    steps:
      - name: Require release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release environment secret: $name"
              exit 1
            fi
          done

  build:
    name: ${{ matrix.asset }}
    environment: release
    needs: [metadata, preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal2 binary (arm64 + x86_64 fused with lipo).
          - os: macos-15
            kind: mac
            asset: eule-helper-darwin-universal
          - os: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            asset: eule-helper-linux-x64
          - os: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
            asset: eule-helper-linux-arm64
          - os: windows-latest
            kind: win
            target: x86_64-pc-windows-msvc
            asset: eule-helper-win32-x64.exe
          # If the windows-11-arm runner is unavailable, switch this to
          # cross-compile aarch64-pc-windows-msvc from windows-latest.
          - os: windows-11-arm
            kind: win
            target: aarch64-pc-windows-msvc
            asset: eule-helper-win32-arm64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # v1; toolchain pinned in rust-toolchain.toml
        with:
          targets: ${{ matrix.kind == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper -> target

      - name: Linux GUI deps (WebKitGTK)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (macOS universal)
        if: matrix.kind == 'mac'
        working-directory: helper
        env:
          # Build on a supported runner without raising the binary's runtime floor.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          # rust-toolchain.toml pins the toolchain here; the action's targets
          # went to another one, so add both to the pinned toolchain.
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output "${{ matrix.asset }}" \
            target/aarch64-apple-darwin/release/eule-helper \
            target/x86_64-apple-darwin/release/eule-helper
          # The universal binary is signed and notarized in the next step.

      - name: Sign & notarize (macOS)
        if: matrix.kind == 'mac'
        working-directory: helper
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          signing_secrets=(
            MACOS_CERT_P12
            MACOS_CERT_PASSWORD
            APPLE_API_KEY
            APPLE_API_ISSUER
            APPLE_API_KEY_CONTENT
          )
          missing=()
          for secret_name in "${signing_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS signing is partially configured; missing: ${missing[*]}"
            exit 1
          fi
          # Developer ID cert → a temporary, self-contained keychain.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 20)"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          API_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          NOTARIZE_ARCHIVE="$RUNNER_TEMP/notarize.zip"
          cleanup_signing() {
            rm -f "$CERT_P12" "$API_KEY_FILE" "$NOTARIZE_ARCHIVE"
            security delete-keychain "$KC" >/dev/null 2>&1 || true
          }
          trap cleanup_signing EXIT
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          # The keychain must be in the user search list before partition ACLs
          # can be assigned reliably on fresh hosted runners.
          security list-keychains -d user -s "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the cert"; exit 1; fi
          # Hardened runtime + secure timestamp (both required for notarization).
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$KC" "${{ matrix.asset }}"
          codesign --verify --strict --verbose=2 "${{ matrix.asset }}"
          # Notarize with the App Store Connect API key. A bare Mach-O cannot be
          # stapled, so the ticket is served online (Gatekeeper checks on first
          # launch of a quarantined copy; our lazy download writes no quarantine).
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_FILE"
          ditto -c -k --keepParent "${{ matrix.asset }}" "$NOTARIZE_ARCHIVE"
          xcrun notarytool submit "$NOTARIZE_ARCHIVE" \
            --key "$API_KEY_FILE" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait

      - name: Build (Linux / Windows)
        if: matrix.kind != 'mac'
        working-directory: helper
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/eule-helper"
          [ "${{ matrix.kind }}" = win ] && bin="${bin}.exe"
          cp "$bin" "${{ matrix.asset }}"

      - name: Checksum
        working-directory: helper
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: helper
          format: spdx-json
          output-file: helper/${{ matrix.asset }}.sbom.spdx.json

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: helper/${{ matrix.asset }}

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "helper/${{ matrix.asset }}" \
            "helper/${{ matrix.asset }}.sha256" \
            "helper/${{ matrix.asset }}.sbom.spdx.json" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  mcpb:
    name: Pack eule-mcp.mcpb
    runs-on: ubuntu-24.04
    needs: [metadata, build]
    # Reads the draft release; see the note on completeness.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
      # No install scripts: better-sqlite3 loads its N-API prebuilds, which
      # ship for every platform, and the bundle is installed the same way.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Download the signed helpers from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir helpers \
            --pattern 'eule-helper-*'
          rm -f helpers/*.sbom.spdx.json
      # pack-mcpb verifies every helper against its .sha256 sidecar.
      - run: node scripts/pack-mcpb.mjs --helpers helpers --all --out release-mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eule-mcp-mcpb
          path: release-mcpb/
          if-no-files-found: error

  mcpb-verify:
    name: Verify eule-mcp.mcpb on ${{ matrix.os }}
    needs: mcpb
    # The one bundle must start on every platform it claims: the server with
    # that platform's better-sqlite3 prebuild, and that platform's helper.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      # The verifier comes from this workflow's revision, not from the tag: the
      # bundle under test is the artifact packed from the tag, and a fixed
      # verifier can then check an existing release through workflow_dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: pnpm
      # Only for the MCP client the smoke test uses.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Runtime libraries, so the smoke test can start the Linux helper.
      - name: Linux GUI deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eule-mcp-mcpb
          path: release-mcpb
      - run: node scripts/verify-mcpb.mjs release-mcpb/eule-mcp.mcpb --all

  mcpb-publish:
    name: Attach eule-mcp.mcpb
    runs-on: ubuntu-24.04
    needs: [metadata, mcpb-verify]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eule-mcp-mcpb
          path: release-mcpb
      - name: Re-check the bundle checksum
        working-directory: release-mcpb
        run: sha256sum --check eule-mcp.mcpb.sha256
      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-mcpb/eule-mcp.mcpb
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-mcpb/eule-mcp.mcpb release-mcpb/eule-mcp.mcpb.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"

  completeness:
    name: Verify release completeness
    runs-on: ubuntu-24.04
    needs: [build, mcpb-publish]
    environment: release
    # The job only reads, but release-please creates the release as a draft,
    # and a token without push access does not see drafts at all: gh reports
    # "release not found" although the assets are there.
    permissions:
      contents: write
    steps:
      - name: Verify every platform asset, checksum, SBOM, and the extension bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for base in eule-helper-darwin-universal eule-helper-linux-x64 eule-helper-linux-arm64 eule-helper-win32-x64.exe eule-helper-win32-arm64.exe; do
            for name in "$base" "$base.sha256" "$base.sbom.spdx.json"; do
              if ! grep -Fxq "$name" <<<"$assets"; then
                echo "::error::Release $RELEASE_TAG is missing $name"
                missing=1
              fi
            done
          done
          for name in eule-mcp.mcpb eule-mcp.mcpb.sha256; do
            if ! grep -Fxq "$name" <<<"$assets"; then
              echo "::error::Release $RELEASE_TAG is missing $name"
              missing=1
            fi
          done
          exit "$missing"
