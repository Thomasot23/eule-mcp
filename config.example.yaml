# Eule MCP configuration
language: de # de | en

# OAuth settings — defaults to Thunderbird's app registration.
# Override with your own Azure AD app if available.
#
# apiVersion: "v2" (default) uses the modern /oauth2/v2.0 endpoint with scope=.
# Set "v1" for locked-down tenants where only a legacy public client is
# consentable (Thunderbird, or "Apple Internet Accounts"
# f8d98a96-0999-43f5-8af3-69971c7bb423 for EWS): v1 uses /oauth2 with resource=.
# The v1-vs-v2 choice + client id are stored per token, so refresh reuses them.
# extraScopes appends v2 scopes to the tier defaults. Microsoft To Do needs
# Tasks.ReadWrite, which Thunderbird's registration does NOT consent, so this is
# opt-in: only add it together with a clientId whose app actually has the
# permission, otherwise every graph login for that client starts failing.
# oauth:
#   clientId: "9e5f94bc-e8a4-4e73-b8be-63364c29d753"
#   tenant: "common"
#   apiVersion: "v2" # or "v1"
#   redirectUri: "urn:ietf:wg:oauth:2.0:oob" # only if registered for this client
#   extraScopes:
#     - "https://graph.microsoft.com/Tasks.ReadWrite"

# Optional native-webview autofill for `auth_login` / CLI `login --capture`.
# Both bindings are explicit opt-ins and must be captured through Eule's local
# credential window, never entered in YAML:
#   node dist/cli/index.js secret totp --account user@example.com
#   node dist/cli/index.js secret password --account user@example.com
# autoAuth:
#   - account: "user@example.com"
#     totpSecretRef: "totp/0123456789abcdef.a1b2c3d4" # generated by Eule
#     passwordSecretRef: "oauth/m365/password/0123456789abcdef.a1b2c3d4" # generated by Eule
#
# Or keep the TOTP seed on a YubiKey (macOS, Windows) instead of totpSecretRef:
#   node dist/cli/index.js secret totp --account user@example.com --yubikey [--touch]
#   - account: "user@example.com"
#     totpYubikey:
#       credential: "eule:user@example.com" # name of the OATH credential on the key
#       touch: false # require a touch per code; applied when Eule writes the credential
#
# Sign in through Safari instead (macOS): security keys such as a YubiKey work
# there, and Safari's Microsoft session often signs in without interaction.
# `eule-mcp login --safari --account user@example.com` sets this; Eule then
# renews a dead sign-in for the account through Safari on its own.
#   - account: "user@example.com"
#     login: safari

# Prefer the MCP `connector_configure` tool or `eule-mcp configure` for
# password/API-token connectors. Their secret is stored by the OS; YAML contains
# only a generated non-secret reference:
# credentialRef: "connector/private/mail/icloud.a1b2c3d4"
# Google OAuth client secrets work the same way through `google_oauth_configure`:
# google:
#   clientId: "123456.apps.googleusercontent.com"
#   clientSecretRef: "oauth/google/client-secret.a1b2c3d4"
# Inline `password:`, `token:`, `clientSecret:`, and `totpSecret:` remain
# supported for migration only.

roles:
  - id: VPDIT
    name: "VP Hochschule Hannover"
    weeklyHours: 20
    contexts: ["@office", "@remote"]
    # Optional enforceable work-context policy. Defaults: enabled, read/write,
    # and all connector domains. A read-only role cannot send, upload, create,
    # update, or delete through its connectors.
    policy:
      enabled: true
      readOnly: false
      allowedConnectorKinds: [mail, calendar, contacts, files, tasks]
    connectors:
      mail:
        - id: vpdit-personal
          type: m365
          account: fabian@hs-hannover.de
        # Shared/delegate mailbox: authenticate as your own account, read the
        # shared one via `mailbox:` (NOT a `shared:` flag — that does nothing).
        - id: vpdit-shared
          type: m365
          account: fabian@hs-hannover.de
          mailbox: vp-dit@hs-hannover.de
      calendar:
        - id: vpdit-cal
          type: m365
          account: fabian@hs-hannover.de
      # Tasks live in your own system, Eule keeps no task database of its own.
      # type: m365   → Microsoft To Do (needs oauth.extraScopes Tasks.ReadWrite)
      # type: caldav → VTODO collections (Apple Reminders, Nextcloud Tasks)
      tasks:
        - id: vpdit-todo
          type: m365
          account: fabian@hs-hannover.de
      # Intranet wiki (MediaWiki/BlueSpice), read-only with your own wiki
      # account. The password is captured via `eule-mcp configure`.
      # wiki:
      #   - id: intranet
      #     type: mediawiki
      #     account: your-wiki-username
      #     url: "https://intranet.example.org/w"
      #     credentialRef: "connector/work/wiki/intranet.a1b2c3d4"
  - id: lexICT
    name: "lexICT GmbH"
    weeklyHours: 8
    connectors:
      mail:
        - id: lexict-mail
          type: m365
          account: fabian@lexict.de
      calendar:
        - id: lexict-cal
          type: m365
          account: fabian@lexict.de
  - id: CDU
    name: "CDU Gehrden"
    weeklyHours: 4
    connectors: {}
  - id: private
    name: "Private"
    weeklyHours: 0
    connectors:
      # Apple Reminders over iCloud CalDAV. Use an app-specific password
      # (appleid.apple.com), captured via `eule-mcp configure`, not inline.
      # tasks:
      #   - id: reminders
      #     type: caldav
      #     account: you@icloud.com
      #     url: "https://caldav.icloud.com"
      #     credentialRef: "connector/private/tasks/reminders.a1b2c3d4"
      {}
