# cargo-deny policy for the Rust helper.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitive GTK/WebKit dependency; upstream offers no safe upgrade yet. Revisit when gtk-rs removes proc-macro-error." },
  # The current Linux Secret Service backend requires zbus 5. These crates
  # moved into zbus 6; this is a maintenance notice, not a vulnerability.
  # Remove these entries when secret-service and its keyring backend use zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled in by the Linux keyring backend through secret-service and zbus 5; remove when the backend migrates to zbus 6." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled in by the Linux keyring backend through secret-service and zbus 5; remove when the backend migrates to zbus 6." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled in by the Linux keyring backend through secret-service and zbus 5; remove when the backend migrates to zbus 6." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-or-later",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
