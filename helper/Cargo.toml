[package]
name = "eule-helper"
version = "0.8.1" # x-release-please-version
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/metaneutrons/eule-mcp"
publish = ["crates-io"]

[dependencies]
base32 = "0.5.1"
base64 = "0.23.1"
clap = { version = "4.6.2", features = ["derive"] }
getrandom = "0.4.3"
keyring = "4.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tao = "0.37.1"
totp-lite = "2.0.1"
ureq = "3.3.0"
url = "2.5.8"
wry = "0.57.0"
zeroize = "1.8.2"

# YubiKey OATH over PC/SC. macOS and Windows ship PC/SC with the OS; on Linux
# pcsc-sys would link libpcsclite at build and run time, so the helper builds
# without YubiKey support there and falls back to manual code entry.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
pcsc = "2.9.0"
